name: CI

# Runs on every push and pull request. Railway deploys from main, so a red
# build here is the last chance to catch a break before it reaches customers.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          HAULCHIME_QUIET_STARTUP: '1'
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the static site
        run: node build.js
      - name: Check the quote app parses
        run: node -e "new Function(require('fs').readFileSync('dist/js/main.js','utf8'))"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to merge a committed .env or API key
        run: |
          if git ls-files --error-unmatch backend/.env 2>/dev/null; then
            echo "::error::backend/.env is tracked by git. Remove it and rotate every key inside."
            exit 1
          fi
          if git grep -nE '(bk_(us|eu)1_[A-Za-z0-9]|auth-token=[A-Za-z0-9]{10})' -- . ':!*.md' ':!.github/*'; then
            echo "::error::A live-looking API key is committed. Rotate it and remove it."
            exit 1
          fi
          echo "No secrets found in tracked files."
