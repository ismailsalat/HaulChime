{% extends "admin/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<style>
  main { display:flex; min-height:70vh; align-items:center; justify-content:center; }
  .login-card { width:100%; max-width:380px; }
</style>
<div class="card login-card">
  <h1 style="font-size:1.25rem">HaulChime Admin</h1>
  <p class="muted small">Sign in to manage leads and partners.</p>
  {% if error %}<p class="badge red" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <label class="req" for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required autofocus>
    <label class="req" for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button style="width:100%; margin-top:16px">Log in</button>
  </form>
</div>
{% endblock %}
